<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Система підбору квартир</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container">

    <h1>🏠 Система підбору квартир</h1>

    <div class="form">

        <h2>Додати квартиру</h2>

        <input
                type="text"
                id="address"
                placeholder="Адреса">

        <input
                type="number"
                id="area"
                placeholder="Площа (м²)">

        <input
                type="number"
                id="rooms"
                placeholder="Кількість кімнат">

        <input
                type="number"
                id="floor"
                placeholder="Поверх">

        <input
                type="number"
                id="price"
                placeholder="Ціна ($)">

        <button onclick="addApartment()">
            ➕ Додати квартиру
        </button>

    </div>

    <div class="search">

        <h2>Пошук квартир за бюджетом</h2>

        <input
                type="number"
                id="maxPrice"
                placeholder="Максимальна ціна">

        <button onclick="filterApartments()">
            🔍 Знайти
        </button>

        <button onclick="showApartments(apartments)">
            📋 Показати всі
        </button>

    </div>

    <div id="bestApartment">

    </div>

    <h2>Список квартир</h2>

    <div
            id="cards"
            class="cards">

    </div>

</div>

<script src="script.js"></script>

</body>
</html>

<script src="script.js"></script>

</body>
</html>
